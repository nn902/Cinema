<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NM Cinema</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Шапка с логотипом -->
    <header class="header">
        <div class="logo">NM<span>CINEMA</span></div>
        <div class="header-search-btn" onclick="showPage('searchPage')">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
    </header>

    <!-- Главная страница -->
    <main id="mainPage" class="page active">
        <!-- Большой баннер (Hero) -->
        <div class="hero-section" id="heroSection">
            <div class="hero-content">
                <h1 id="heroTitle">Загрузка...</h1>
                <p>Эксклюзивная премьера на NM Cinema</p>
                <button class="btn-primary" onclick="playFeatured()">Смотреть</button>
            </div>
        </div>
        
        <!-- Контейнер для категорий -->
        <div id="categoriesContainer" class="categories-container"></div>
    </main>

    <!-- Страница поиска -->
    <main id="searchPage" class="page">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Фильмы, сериалы, категории...">
        </div>
        <div id="suggestionsBox" class="suggestions"></div>
        <div id="searchResults" class="movies-grid"></div>
    </main>

    <!-- Профиль -->
    <main id="profilePage" class="page">
        <div class="profile-card">
            <div class="avatar" id="userAvatar">U</div>
            <h2 id="userName">Загрузка...</h2>
            <p id="userUsername">@...</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><h3 id="statWatchTime">0ч</h3><p>Просмотрено</p></div>
            <div class="stat-card"><h3 id="statMoviesBought">0</h3><p>Куплено</p></div>
            <div class="stat-card"><h3 id="statRefs">0</h3><p>Друзей</p></div>
            <div class="stat-card"><h3 id="statBalance">0</h3><p>Баллов</p></div>
        </div>

        <button class="btn-green" onclick="showMyMovies()">
            <svg viewBox="0 0 24 24" style="width:20px; fill:white; vertical-align:middle; margin-right:8px;"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
            Мои фильмы
        </button>
    </main>

    <!-- Мои фильмы -->
    <main id="myMoviesPage" class="page">
        <button class="btn-back" onclick="showPage('profilePage')">← Назад в профиль</button>
        <h2 style="margin: 15px 0;">Купленные фильмы</h2>
        <div id="myMoviesList" class="movies-grid"></div>
    </main>

    <!-- Нижнее меню (SVG иконки) -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('mainPage')" id="navHome">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="showPage('searchPage')" id="navSearch">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Поиск</span>
        </div>
        <div class="nav-item" onclick="showPage('profilePage')" id="navProfile">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Профиль</span>
        </div>
    </nav>

    <!-- Кастомный плеер -->
    <div id="playerModal" class="player-modal">
        <div class="player-controls">
            <button class="close-btn" onclick="closePlayer()">
                <svg viewBox="0 0 24 24" style="fill:white; width:30px;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <h3 id="playerTitle">Фильм</h3>
        </div>
        <div class="video-container">
            <video id="videoPlayer" controls playsinline></video>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
